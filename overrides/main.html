<!-- Favicons. Paths are relative so they work on both
     https://ppuc.org/ and https://ppuc.github.io/docs/.
     ppuc.org proxies / to the GitHub Pages /docs/ path, so a hardcoded
     /docs/ prefix resolves to .../docs/docs/... and 404s. -->
{% extends "base.html" %}
{% block extrahead %}
{{ super() }}
<link rel="icon" type="image/png" href="{{ 'images/icons/favicon-96x96.png' | url }}" sizes="96x96" />
<link rel="icon" type="image/svg+xml" href="{{ 'images/icons/favicon.svg' | url }}" />
<link rel="shortcut icon" href="{{ 'images/icons/favicon.ico' | url }}" />
<link rel="apple-touch-icon" sizes="180x180" href="{{ 'images/icons/apple-touch-icon.png' | url }}" />
<meta name="apple-mobile-web-app-title" content="PPUC" />
<link rel="manifest" href="{{ 'images/icons/site.webmanifest' | url }}" />
<meta name="theme-color" content="#111111" />
<meta name="color-scheme" content="dark light" />
<!-- Link previews for Discord, Slack, GitHub and social media. -->
<meta property="og:type" content="website" />
<meta property="og:site_name" content="{{ config.site_name }}" />
<meta property="og:url" content="{{ page.canonical_url if page and page.canonical_url else config.site_url }}" />
<meta property="og:image" content="{{ config.site_url }}images/logo.png" />
<meta name="twitter:card" content="summary" />
{% if page and page.title and not page.is_homepage %}
<meta property="og:title" content="{{ page.title }} - {{ config.site_name }}" />
<meta name="twitter:title" content="{{ page.title }} - {{ config.site_name }}" />
{% else %}
<meta property="og:title" content="{{ config.site_name }}" />
<meta name="twitter:title" content="{{ config.site_name }}" />
{% endif %}
{% if page and page.meta and page.meta.description %}
<meta property="og:description" content="{{ page.meta.description }}" />
<meta name="twitter:description" content="{{ page.meta.description }}" />
{% else %}
<meta property="og:description" content="{{ config.site_description }}" />
<meta name="twitter:description" content="{{ config.site_description }}" />
{% endif %}
{% endblock %}
