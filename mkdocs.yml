site_name: Pinball Power-Up Controller & DMD
site_url: https://ppuc.org/
site_description: Pinball Power-Up Controller & DMD (PPUC) is a free and open-source pinball controller and display system.
site_author: PPUC
copyright: Copyright &copy; PPUC contributors
use_directory_urls: true
repo_url: https://github.com/PPUC
repo_name: PPUC on GitHub
edit_uri: docs/blob/main/docs/
docs_dir: docs

plugins:
  - search:
      separator: '[\s\-,:!=\[\]()"`/]+|\.(?!\d)|&[lg]t;|(?!\b)(?=[A-Z][a-z])'
  - github_repos:
      organization: PPUC
      cache_minutes: 30
      github_token: ""  # Only needed for private repos
      exclude_repos:
        - dmd
        - docs
        - .github
        - ZeDMD_Updater
        - ColorizingDMD
        - pindmd3-firmware
        - libppuclogger
      include_archived: false  # Whether to show archived repos
      forked_repos:
        - dmd-extensions
        - pinmame
        - libdmdutil

extra_css:
  - stylesheets/ppuc.css

markdown_extensions:
  - toc:
      permalink: true
      title: On this page
  - admonition
  - attr_list
  - md_in_html
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.snippets:
      base_path: includes
      check_paths: true
      auto_append:
        - content_footer.md
  - pymdownx.keys
  - pymdownx.extra

theme:
  name: material
  # Relative paths. ppuc.org proxies / to https://ppuc.github.io/docs/,
  # so a leading /docs/ prefix 404s on the custom domain.
  logo: images/logo.png
  favicon: images/icons/favicon.ico
  icon:
    repo: fontawesome/brands/github
    edit: fontawesome/solid/wand-magic-sparkles
  custom_dir: overrides

  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.path
    - navigation.prune
    - navigation.tracking
    - navigation.instant
    - navigation.instant.progress
    - navigation.footer
    - navigation.indexes
    - navigation.top
    - search.suggest
    - search.highlight
    - search.share
    - content.action.edit
    - content.action.view
    - content.code.copy
    - content.code.annotate
    - toc.follow

  palette:
    - media: "(prefers-color-scheme)"
      toggle:
        icon: material/brightness-auto
        name: Switch to light mode
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: black
      accent: deep orange
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: black
      accent: deep orange
      toggle:
        icon: material/brightness-4
        name: Switch to system preference
  font:
    text: Open Sans
    code: Noto Sans Mono

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/PPUC
      name: PPUC Organization
    - icon: fontawesome/brands/discord
      link: https://discord.gg/fkkk4MbBn5
      name: Join our Discord
  base_url: /docs/

nav:
  - Overview: index.md
  - PPUC:
    - ppuc/index.md
    - ppuc/getting_started.md
    - ppuc/config_tool.md
    - ppuc/build_from_source.md
    - ppuc/how_to_run.md
  - "PPUC Hardware":
    - ppuc_hardware/index.md
    - ppuc_hardware/io_16_8_1.md
    - ppuc_hardware/io_16x8_matrix.md
    - ppuc_hardware/out_8x10.md
    - ppuc_hardware/opto_16.md
  - ZeDMD:
    - zedmd/index.md
  - PPUC/DMD:
    - ppuc_dmd/index.md
    - ppuc_dmd/when_things_dont_work.md
  - GitHub Repositories: github_repos.md
  - Help:
    - about/help.md
    - about/help_docs.md
